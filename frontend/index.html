<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chess Tutor</title>
  <link rel="stylesheet" href="./vendor/cm-chessboard/assets/chessboard.css">
  <link rel="stylesheet" href="./vendor/cm-chessboard/assets/extensions/markers/markers.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo">♞</span>
      <h1>AI Chess Tutor</h1>
    </div>
    <div class="header-right">
      <div id="speech-controls" class="speech-controls hidden">
        <button id="btn-read-aloud" class="btn toggle" aria-pressed="false"
                title="Read the tutor's messages aloud; squares light up on the board as they're spoken">🔊 Read aloud</button>
        <select id="speech-rate" title="Reading speed" aria-label="Reading speed">
          <option value="0.8">Slow</option>
          <option value="1" selected>Normal</option>
          <option value="1.2">Fast</option>
        </select>
        <select id="speech-voice" title="Voice" aria-label="Voice"></select>
        <button id="btn-stop-speech" class="btn hidden" title="Stop reading">■ Stop</button>
      </div>
      <span id="health" class="health" title="checking…"></span>
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar">
      <h2>Your lessons</h2>
      <div id="course-list" class="course-list"></div>
    </aside>

    <main class="main">
      <section class="board-pane">
        <div id="board"></div>
        <div id="board-status" class="board-status"></div>
      </section>

      <section class="lesson-pane">
        <div class="lesson-header">
          <h2 id="lesson-title">Welcome</h2>
          <span id="step-indicator" class="step-indicator"></span>
        </div>
        <div id="messages" class="messages">
          <div class="msg assistant" id="welcome">What do you want to learn? Type it below — for example <b>“teach me knight forks”</b> or <b>“I want to learn the London System”</b> — and I'll build a lesson for you. Or pick a topic:</div>
        </div>
        <div id="feedback-slot"></div>
        <div class="controls">
          <button id="btn-continue" class="btn primary hidden">Continue →</button>
          <button id="btn-hint" class="btn hidden">💡 Hint</button>
          <button id="btn-reveal" class="btn hidden">Show solution</button>
          <button id="btn-play" class="btn hidden">↻ Watch again</button>
          <button id="btn-explain-example" class="btn hidden" title="The AI teacher explains this verified example">🧠 Explain this example</button>
        </div>
        <div class="chat-row">
          <input id="chat-input" type="text" placeholder="What do you want to learn? Or ask a question…"
                 autocomplete="off">
          <button id="btn-chat" class="btn primary">Send</button>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
